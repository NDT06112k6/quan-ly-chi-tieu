<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh mục | Expense Tracker</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-4 py-md-5">
    <section class="card border-0 rounded-4 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4">Danh mục của tôi</h1>
            <nav class="d-flex flex-wrap align-items-center justify-content-between gap-3 my-4"
                 aria-label="Điều hướng danh mục">
                <a class="btn btn-primary" th:href="@{/categories/new}">Thêm danh mục</a>
                <a class="btn btn-outline-secondary" th:href="@{/}">Quay lại trang chủ</a>
            </nav>
            <p th:if="${categories.totalElements == 0}">Bạn chưa có danh mục nào.</p>
            <div class="table-responsive" th:if="${!categories.empty}">
                <table class="table table-bordered table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Tên</th>
                        <th scope="col">Loại</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="category : ${categories.content}">
                        <td th:text="${category.name}"></td>
                        <td th:text="${category.type == 'CHI' ? 'Chi tiêu (CHI)' : 'Thu nhập (THU)'}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <nav class="d-flex flex-wrap align-items-center justify-content-between gap-3 my-4" aria-label="Phân trang"
                 th:if="${categories.totalPages > 1}">
                <a class="btn btn-outline-primary" th:if="${categories.hasPrevious()}"
                   th:href="@{/categories(page=${categories.number - 1},size=${categories.size})}">Trang trước</a>
                <span th:text="|Trang ${categories.number + 1} / ${categories.totalPages}|"></span>
                <a class="btn btn-outline-primary" th:if="${categories.hasNext()}"
                   th:href="@{/categories(page=${categories.number + 1},size=${categories.size})}">Trang sau</a>
            </nav>
        </div>
    </section>
</main>
</body>
</html>
