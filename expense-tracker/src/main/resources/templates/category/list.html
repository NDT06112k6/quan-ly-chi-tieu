<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{layout/main-layout :: layout('Danh mục', 'categories', ~{::content})}">
    <div th:fragment="content" class="page-content">
        <section class="card border-0 rounded-4 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-3">Danh mục của tôi</h1>
                <p class="page-description mb-4">Sắp xếp các khoản thu, chi theo cách phù hợp với bạn.</p>
                <nav class="d-flex flex-wrap align-items-center justify-content-between gap-3 my-4"
                     aria-label="Điều hướng danh mục">
                    <a class="btn btn-primary" th:href="@{/categories/new}">Thêm danh mục</a>
                </nav>
                <p class="empty-state" th:if="${categories.totalElements == 0}">Bạn chưa có danh mục nào.</p>
                <div class="table-responsive" th:if="${!categories.empty}">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">Tên</th>
                            <th scope="col">Loại</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="category : ${categories.content}">
                            <td th:text="${category.name}"></td>
                            <td th:text="${category.type == 'CHI' ? 'Chi tiêu (CHI)' : 'Thu nhập (THU)'}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <nav class="d-flex flex-wrap align-items-center justify-content-between gap-3 my-4"
                     aria-label="Phân trang"
                     th:if="${categories.totalPages > 1}">
                    <a class="btn btn-outline-primary" th:if="${categories.hasPrevious()}"
                       th:href="@{/categories(page=${categories.number - 1},size=${categories.size})}">Trang trước</a>
                    <span th:text="|Trang ${categories.number + 1} / ${categories.totalPages}|"></span>
                    <a class="btn btn-outline-primary" th:if="${categories.hasNext()}"
                       th:href="@{/categories(page=${categories.number + 1},size=${categories.size})}">Trang sau</a>
                </nav>
            </div>
        </section>
    </div>
</th:block>
