<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm danh mục | Expense Tracker</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/category.css}">
</head>
<body>
<main class="auth-card">
    <h1>Thêm danh mục</h1>
    <form method="post" th:action="@{/categories}" th:object="${categoryDTO}">
        <div class="field">
            <label for="name">Tên danh mục</label>
            <input type="text" id="name" th:field="*{name}" maxlength="100" required
                   th:errorclass="invalid" aria-describedby="name-error">
            <p class="error" id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div class="field">
            <label for="type">Loại danh mục</label>
            <select id="type" th:field="*{type}" required th:errorclass="invalid" aria-describedby="type-error">
                <option value="">Chọn loại danh mục</option>
                <option th:each="categoryType : ${categoryTypes}" th:value="${categoryType.name()}"
                        th:text="${categoryType.name() == 'CHI' ? 'Chi tiêu (CHI)' : 'Thu nhập (THU)'}"></option>
            </select>
            <p class="error" id="type-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
        </div>
        <button type="submit">Lưu danh mục</button>
    </form>
    <p class="switch-form"><a th:href="@{/categories}">Quay lại danh sách</a></p>
</main>
</body>
</html>
