<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm danh mục | Expense Tracker</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-4 py-md-5">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <section class="card border-0 rounded-4 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 mb-4">Thêm danh mục</h1>
                    <form method="post" th:action="@{/categories}" th:object="${categoryDTO}">
                        <div class="mb-3">
                            <label class="form-label" for="name">Tên danh mục</label>
                            <input class="form-control" type="text" id="name" th:field="*{name}" maxlength="100"
                                   required
                                   th:errorclass="is-invalid" aria-describedby="name-error">
                            <p class="invalid-feedback d-block" id="name-error" th:if="${#fields.hasErrors('name')}"
                               th:errors="*{name}"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="type">Loại danh mục</label>
                            <select class="form-select" id="type" th:field="*{type}" required th:errorclass="is-invalid"
                                    aria-describedby="type-error">
                                <option value="">Chọn loại danh mục</option>
                                <option th:each="categoryType : ${categoryTypes}" th:value="${categoryType.name()}"
                                        th:text="${categoryType.name() == 'CHI' ? 'Chi tiêu (CHI)' : 'Thu nhập (THU)'}"></option>
                            </select>
                            <p class="invalid-feedback d-block" id="type-error" th:if="${#fields.hasErrors('type')}"
                               th:errors="*{type}"></p>
                        </div>
                        <button class="btn btn-primary" type="submit">Lưu danh mục</button>
                    </form>
                    <p class="text-center text-body-secondary mt-4 mb-0"><a th:href="@{/categories}">Quay lại danh
                        sách</a></p>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
