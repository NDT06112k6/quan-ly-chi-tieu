<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký | Expense Tracker</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-card">
    <p class="brand">Expense Tracker</p>
    <h1>Tạo tài khoản</h1>
    <p class="intro">Bắt đầu quản lý chi tiêu cá nhân của bạn.</p>

    <form method="post" th:action="@{/register}" th:object="${userRegisterDTO}">
        <div class="field">
            <label for="displayName">Tên hiển thị</label>
            <input type="text" id="displayName" th:field="*{displayName}"
                   autocomplete="nickname" maxlength="100" required th:errorclass="invalid"
                   aria-describedby="displayName-error">
            <p class="error" id="displayName-error" th:if="${#fields.hasErrors('displayName')}"
               th:errors="*{displayName}"></p>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}"
                   autocomplete="email" maxlength="255" required th:errorclass="invalid"
                   aria-describedby="email-error">
            <p class="error" id="email-error" th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"></p>
        </div>
        <div class="field">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" autocomplete="new-password"
                   minlength="8" maxlength="72" required aria-describedby="password-help password-error">
            <p class="help" id="password-help">Từ 8 đến 72 ký tự, tối đa 72 byte UTF-8.</p>
            <p class="error" id="password-error" th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></p>
        </div>
        <div class="field">
            <label for="confirmPassword">Nhập lại mật khẩu</label>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password"
                   minlength="8" maxlength="72" required aria-describedby="confirmPassword-error">
            <p class="error" id="confirmPassword-error" th:if="${#fields.hasErrors('confirmPassword')}"
               th:errors="*{confirmPassword}"></p>
        </div>
        <button type="submit">Đăng ký</button>
    </form>
    <p class="switch-form">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
</main>
</body>
</html>
