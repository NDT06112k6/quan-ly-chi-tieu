<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{layout/main-layout :: layout('Đăng ký', 'register', ~{::content})}">
    <div th:fragment="content" class="page-content auth-content">
        <div class="row justify-content-center">
            <div class="col-12">
                <section class="card border-0 rounded-4 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <p class="text-primary fw-bold mb-4">Expense Tracker</p>
                        <h1 class="h3 mb-3">Tạo tài khoản</h1>
                        <p class="text-body-secondary mb-4">Bắt đầu quản lý chi tiêu cá nhân của bạn.</p>

                        <form method="post" th:action="@{/register}" th:object="${userRegisterDTO}">
                            <div class="mb-3">
                                <label class="form-label" for="displayName">Tên hiển thị</label>
                                <input class="form-control" type="text" id="displayName" th:field="*{displayName}"
                                       autocomplete="nickname" maxlength="100" required th:errorclass="is-invalid"
                                       aria-describedby="displayName-error">
                                <p class="invalid-feedback d-block" id="displayName-error"
                                   th:if="${#fields.hasErrors('displayName')}"
                                   th:errors="*{displayName}"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="email">Email</label>
                                <input class="form-control" type="email" id="email" th:field="*{email}"
                                       autocomplete="email" maxlength="255" required th:errorclass="is-invalid"
                                       aria-describedby="email-error">
                                <p class="invalid-feedback d-block" id="email-error"
                                   th:if="${#fields.hasErrors('email')}"
                                   th:errors="*{email}"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="password">Mật khẩu</label>
                                <input class="form-control" type="password" id="password" name="password"
                                       th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}"
                                       autocomplete="new-password"
                                       minlength="8" maxlength="72" required
                                       aria-describedby="password-help password-error">
                                <p class="form-text" id="password-help">Từ 8 đến 72 ký tự, tối đa 72 byte UTF-8.</p>
                                <p class="invalid-feedback d-block" id="password-error"
                                   th:if="${#fields.hasErrors('password')}"
                                   th:errors="*{password}"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="confirmPassword">Nhập lại mật khẩu</label>
                                <input class="form-control" type="password" id="confirmPassword" name="confirmPassword"
                                       th:classappend="${#fields.hasErrors('confirmPassword') ? 'is-invalid' : ''}"
                                       autocomplete="new-password"
                                       minlength="8" maxlength="72" required aria-describedby="confirmPassword-error">
                                <p class="invalid-feedback d-block" id="confirmPassword-error"
                                   th:if="${#fields.hasErrors('confirmPassword')}"
                                   th:errors="*{confirmPassword}"></p>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Đăng ký</button>
                        </form>
                        <p class="text-center text-body-secondary mt-4 mb-0">Đã có tài khoản? <a th:href="@{/login}">Đăng
                            nhập</a></p>
                    </div>
                </section>
            </div>
        </div>
    </div>
</th:block>
