<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Expense Tracker</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <section class="card border-0 rounded-4 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <p class="text-primary fw-bold mb-4">Expense Tracker</p>
                    <h1 class="h3 mb-4">Đăng nhập</h1>
                    <p class="text-body-secondary mb-4">Chào mừng bạn trở lại.</p>
                    <p class="alert alert-success" role="status" th:if="${param.success != null}">
                        Đăng ký thành công. Bạn có thể đăng nhập ngay.
                    </p>
                    <p class="alert alert-success" role="status" th:if="${param.logout != null}">
                        Bạn đã đăng xuất thành công.
                    </p>

                    <form method="post" th:action="@{/login}" th:object="${userLoginDTO}">
                        <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}"
                             th:errors="*{global}"></div>
                        <div class="mb-3">
                            <label class="form-label" for="username">Email</label>
                            <input class="form-control" type="email" id="username" th:field="*{username}"
                                   autocomplete="username" maxlength="255" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Mật khẩu</label>
                            <input class="form-control" type="password" id="password" name="password"
                                   autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
                    </form>
                    <p class="text-center text-body-secondary mt-4 mb-0">Chưa có tài khoản? <a th:href="@{/register}">Đăng
                        ký</a></p>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
