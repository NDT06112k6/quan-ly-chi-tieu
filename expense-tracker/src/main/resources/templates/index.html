<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang chủ | Expense Tracker</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-md-10 col-lg-8">
            <section class="card border-0 rounded-4 shadow-sm text-center">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 mb-4">Chào mừng đến với Expense Tracker</h1>
                    <form method="post" th:action="@{/logout}">
                        <button class="btn btn-outline-danger px-4" type="submit">Đăng xuất</button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
