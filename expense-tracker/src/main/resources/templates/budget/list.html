<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ngân sách | Expense Tracker</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-4 py-md-5">
    <section class="card border-0 rounded-4 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4">Ngân sách của tôi</h1>
            <nav class="d-flex flex-wrap justify-content-between gap-3 mb-4" aria-label="Điều hướng ngân sách">
                <a class="btn btn-primary" th:href="@{/budgets/new}">Thiết lập ngân sách</a>
                <a class="btn btn-outline-secondary" th:href="@{/}">Quay lại trang chủ</a>
            </nav>
            <p class="alert alert-info" th:if="${budgets.totalElements == 0}">Bạn chưa có ngân sách nào.</p>
            <div class="table-responsive" th:if="${!budgets.empty}">
                <table class="table table-bordered table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Tháng</th>
                        <th scope="col">Danh mục</th>
                        <th class="text-end" scope="col">Hạn mức</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="budget : ${budgets.content}">
                        <td class="text-nowrap" th:text="${budget.month}"></td>
                        <td class="text-break" th:text="${categoryNames[budget.categoryId]}"></td>
                        <td class="text-end text-nowrap font-monospace fw-semibold"
                            th:text="${budget.limitAmount.toPlainString()}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <nav class="d-flex justify-content-center align-items-center gap-3 mt-4"
                 aria-label="Phân trang" th:if="${budgets.totalPages > 1}">
                <a class="btn btn-outline-primary" th:if="${budgets.hasPrevious()}"
                   th:href="@{/budgets(page=${budgets.number - 1},size=${budgets.size})}">Trang trước</a>
                <span th:text="|Trang ${budgets.number + 1} / ${budgets.totalPages}|"></span>
                <a class="btn btn-outline-primary" th:if="${budgets.hasNext()}"
                   th:href="@{/budgets(page=${budgets.number + 1},size=${budgets.size})}">Trang sau</a>
            </nav>
        </div>
    </section>
</main>
</body>
</html>
