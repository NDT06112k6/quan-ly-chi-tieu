<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giao dịch | Expense Tracker</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-4 py-md-5">
    <section class="card border-0 rounded-4 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4">Giao dịch của tôi</h1>
            <nav class="d-flex flex-wrap align-items-center justify-content-between gap-3 my-4"
                 aria-label="Điều hướng giao dịch">
                <a class="btn btn-primary" th:href="@{/transactions/new}">Thêm giao dịch</a>
                <a class="btn btn-outline-secondary" th:href="@{/}">Quay lại trang chủ</a>
            </nav>
            <p th:if="${transactions.totalElements == 0}">Bạn chưa có giao dịch nào.</p>
            <div class="table-responsive" th:if="${!transactions.empty}">
                <table class="table table-bordered table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Ngày</th>
                        <th scope="col">Danh mục</th>
                        <th class="text-end" scope="col">Số tiền</th>
                        <th scope="col">Ghi chú</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="transaction : ${transactions.content}">
                        <td th:text="${transaction.occurredOn}"></td>
                        <td th:text="${categoryNames[transaction.categoryId]}"></td>
                        <td class="text-end text-nowrap font-monospace fw-semibold"
                            th:classappend="${categoryTypes[transaction.categoryId] == 'CHI' ? 'text-danger' : 'text-success'}"
                            th:text="${transaction.amount.toPlainString()}"></td>
                        <td th:text="${transaction.note}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <nav class="d-flex flex-wrap align-items-center justify-content-between gap-3 my-4" aria-label="Phân trang"
                 th:if="${transactions.totalPages > 1}">
                <a class="btn btn-outline-secondary" th:if="${transactions.hasPrevious()}"
                   th:href="@{/transactions(page=${transactions.number - 1})}">Trang trước</a>
                <span th:text="|Trang ${transactions.number + 1} / ${transactions.totalPages}|"></span>
                <a class="btn btn-outline-secondary" th:if="${transactions.hasNext()}"
                   th:href="@{/transactions(page=${transactions.number + 1})}">Trang sau</a>
            </nav>
        </div>
    </section>
</main>
</body>
</html>
