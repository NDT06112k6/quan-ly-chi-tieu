<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tài khoản của tôi | Expense Tracker</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
            <section class="card border-0 rounded-4 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 mb-4">Tài khoản của tôi</h1>
                    <dl class="row mb-4">
                        <dt class="col-sm-4">Email</dt>
                        <dd class="col-sm-8 text-break" th:text="${profile.email}"></dd>
                        <dt class="col-sm-4">Tên hiển thị</dt>
                        <dd class="col-sm-8 text-break" th:text="${profile.displayName}"></dd>
                    </dl>
                    <p class="alert alert-success" role="status" th:if="${param.success != null}">
                        Đổi mật khẩu thành công.
                    </p>
                    <h2 class="h5 mb-3">Đổi mật khẩu</h2>
                    <form method="post" th:action="@{/profile/change-password}" th:object="${passwordChangeDTO}">
                        <div class="mb-3">
                            <label class="form-label" for="oldPassword">Mật khẩu hiện tại</label>
                            <input class="form-control" type="password" id="oldPassword" name="oldPassword"
                                   autocomplete="current-password" maxlength="72" required
                                   th:errorclass="is-invalid" th:field="*{oldPassword}"
                                   aria-describedby="oldPassword-error">
                            <p class="invalid-feedback d-block" id="oldPassword-error"
                               th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></p>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="newPassword">Mật khẩu mới</label>
                            <input class="form-control" type="password" id="newPassword" name="newPassword"
                                   autocomplete="new-password" minlength="8" maxlength="72" required
                                   th:errorclass="is-invalid" th:field="*{newPassword}"
                                   aria-describedby="newPassword-help newPassword-error">
                            <p class="form-text" id="newPassword-help">Từ 8 đến 72 ký tự, tối đa 72 byte UTF-8.</p>
                            <p class="invalid-feedback d-block" id="newPassword-error"
                               th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
                        </div>
                        <div class="d-grid gap-2 d-sm-flex">
                            <button class="btn btn-primary" type="submit">Đổi mật khẩu</button>
                            <a class="btn btn-outline-secondary" th:href="@{/}">Quay lại trang chủ</a>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
